<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores Amarillas</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fffbea;
        overflow: hidden;
        text-align: center;
    }

    #selector {
        position: absolute;
        top: 35%;
        width: 100%;
        padding: 0 10px;
    }

    #number {
        font-size: clamp(2.5rem, 8vw, 4rem);
        margin: 20px;
    }

    button {
        font-size: clamp(1.5rem, 6vw, 2rem);
        padding: 12px 20px;
        margin: 10px;
        border: none;
        border-radius: 12px;
        background: #ffd54f;
        cursor: pointer;
    }

    /* CONTENEDOR DE FLORES */
    #flowers {
        position: absolute;
        width: 100%;
        height: 100%;
        display: none;
        overflow: hidden;
    }

    .flower {
        position: absolute;
        animation: fall linear infinite;
    }

    @keyframes fall {
        from {
            transform: translateY(-10%);
            opacity: 1;
        }
        to {
            transform: translateY(110vh);
            opacity: 0;
        }
    }

    /* MENSAJE FINAL */
    #message {
        position: absolute;
        top: 55%;
        width: 100%;
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        color: #f4a300;
        display: none;
        animation: fadeIn 2s ease-in-out;
        padding: 0 15px;
    }

    /* IMAGEN */
    #imageBox {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(150px, 40vw, 250px);
        height: clamp(150px, 40vw, 250px);
        border-radius: 20px;
        overflow: hidden;
        display: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    #imageBox img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>

<div id="selector">
    <div id="number">0</div>
    <button onclick="startAnimation()">➕</button>
    <button onclick="startAnimation()">➖</button>
</div>

<div id="flowers"></div>

<!-- CUADRO DE IMAGEN -->
<div id="imageBox">
    <img src="freen.jpg" alt="Imagen especial">
</div>

<div id="message">
    💛 Te mereces infinitas flores 💛 <br>
    🌼🌹🌻 ¡Feliz día de las flores amarillas! 🌷💐
</div>

<script>
let number = 0;
let animating = false;

const flowerTypes = ["🌼", "🌻", "🌻", "🌷", "💐"];

function startAnimation() {
    if (animating) return;
    animating = true;

    let interval = setInterval(() => {
        number += Math.floor(Math.random() * 20) + 5;

        if (number >= 1000) {
            document.getElementById("number").innerText = "∞";
            clearInterval(interval);

            setTimeout(showFlowers, 800);
        } else {
            document.getElementById("number").innerText = number;
        }
    }, 50);
}

function showFlowers() {
    document.getElementById("selector").style.display = "none";

    const flowersContainer = document.getElementById("flowers");
    flowersContainer.style.display = "block";

    // Mostrar imagen
    document.getElementById("imageBox").style.display = "block";

    for (let i = 0; i < 80; i++) {
        createFlower(flowersContainer);
    }

    document.getElementById("message").style.display = "block";
}

function createFlower(container) {
    const flower = document.createElement("div");
    flower.classList.add("flower");

    flower.innerText = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];

    flower.style.left = Math.random() * 100 + "vw";
    flower.style.animationDuration = (Math.random() * 3 + 2) + "s";
    flower.style.fontSize = (Math.random() * 25 + 20) + "px";

    container.appendChild(flower);

    setTimeout(() => {
        flower.remove();
        createFlower(container);
    }, 5000);
}
</script>

</body>
</html>
